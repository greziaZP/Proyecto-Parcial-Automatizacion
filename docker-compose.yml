services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  db-seed:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: db_seed
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SEED_NUM_DOCENTES: ${SEED_NUM_DOCENTES:-12}
      SEED_NUM_AUXILIARES: ${SEED_NUM_AUXILIARES:-3}
      SEED_NUM_ESTUDIANTES: ${SEED_NUM_ESTUDIANTES:-60}
      SEED_NUM_PADRES: ${SEED_NUM_PADRES:-20}
      SEED_NUM_SECCIONES: ${SEED_NUM_SECCIONES:-10}
      SEED_DIAS_HISTORIAL: ${SEED_DIAS_HISTORIAL:-60}
      SEED_PCT_TARDANZA: ${SEED_PCT_TARDANZA:-12}
      SEED_PCT_AUSENTE: ${SEED_PCT_AUSENTE:-8}
      SEED_PCT_AS_TARDANZA: ${SEED_PCT_AS_TARDANZA:-8}
      SEED_PCT_AS_FALTA: ${SEED_PCT_AS_FALTA:-5}
      SEED_PCT_AS_JUSTIFICADA: ${SEED_PCT_AS_JUSTIFICADA:-2}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  vector-seed:
    build:
      context: ./vector
      dockerfile: Dockerfile
    container_name: vector_seed
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_app
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      AI_MODEL_API_KEY: ${AI_MODEL_API_KEY}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      REKOGNITION_COLLECTION_ID: ${REKOGNITION_COLLECTION_ID:-colegio_faces}
      REKOGNITION_SIMILARITY_THRESHOLD: ${REKOGNITION_SIMILARITY_THRESHOLD:-90.0}
    ports:
      - "8000:8000"
    depends_on:
      db-seed:
        condition: service_completed_successfully
      vector-seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
  qdrant_data: